[project]
name = "agentic-research-platform"
version = "0.1.0"
description = "Planner/worker/critic research agents over an MCP server, a sandboxed CI-triage agent, and an eval + observability harness."
requires-python = ">=3.11,<3.12"
dependencies = [
  "anthropic==2.4.0",
  "mcp==2.3.0",
  "httpx==0.28.1",
  "pydantic>=2.8,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
arp = "arp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["docker: needs a Docker daemon"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["evals/bugs/project"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
